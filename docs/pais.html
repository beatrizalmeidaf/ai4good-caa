<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zuli · Pais</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="icon" href="assets/zuli-64.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fredoka:wght@500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: painel de uma coluna (máx. 1000px). Cabeçalho com perfil ativo, abas, conteúdo por aba.
   Resumo (números) antes do detalhe (gráficos, listas). */
:root {
  --bg: #f3f6fb; --surface: #ffffff; --ink: #17305e; --ink-2: #5a6b88; --line: #d9e1ee;
  --zuli: #f9c440; --zuli-soft: #fff4d1; --accent: #17305e; --accent-ink: #ffffff; --bar: #17305e; --bar-2: #c3cee0;
  --good: #2e8540; --warn: #a15c00; --coral: #e8664a;
  --f-display: "Fredoka", "Atkinson Hyperlegible", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", system-ui, -apple-system, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #0f1828; --surface: #172338; --ink: #e9eff9; --ink-2: #a7b4ca; --line: #2a3a55; --zuli-soft: #3a3320;
    --accent: #f9c440; --accent-ink: #17305e; --bar: #f9c440; --bar-2: #3c4d6b; --good: #6fcf7f; --warn: #f0b45a; --coral: #ff9a80; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #0f1828; --surface: #172338; --ink: #e9eff9; --ink-2: #a7b4ca; --line: #2a3a55; --zuli-soft: #3a3320;
  --accent: #f9c440; --accent-ink: #17305e; --bar: #f9c440; --bar-2: #3c4d6b; --good: #6fcf7f; --warn: #f0b45a; --coral: #ff9a80; color-scheme: dark; }
* { box-sizing: border-box; }
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 var(--f-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
img { max-width: 100%; }
[hidden] { display: none !important; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--coral); outline-offset: 2px; }
.wrap { max-width: 1000px; margin: 0 auto; padding-block: 18px 48px; display: grid; gap: 20px; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 600; margin: 0; text-wrap: balance; line-height: 1.2; }
h1 { font-size: 1.5rem; } h2 { font-size: 1.2rem; } h3 { font-size: 1rem; }
p { margin: 0; max-width: 70ch; }
a { color: var(--ink); font-weight: 700; }
.muted { color: var(--ink-2); }
.small { font-size: .88rem; }
header { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.who { display: flex; gap: 12px; align-items: center; }
.who img { width: 52px; height: 52px; }
.btn { border: 2px solid var(--line); background: var(--surface); border-radius: 12px; padding: 8px 14px; cursor: pointer; font-weight: 700; text-decoration: none; display: inline-flex; gap: 6px; align-items: center; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.perigo { color: var(--coral); }
.btn:disabled { opacity: .5; }
nav.tabs { display: flex; gap: 4px; flex-wrap: wrap; border-bottom: 2px solid var(--line); }
nav.tabs button { border: 0; background: none; padding: 8px 14px; font-weight: 700; color: var(--ink-2); cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -2px; }
nav.tabs button[aria-selected="true"] { color: var(--ink); border-color: var(--zuli); }
section.view { display: grid; gap: 18px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: grid; gap: 12px; min-width: 0; align-content: start; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; display: grid; gap: 2px; align-content: start; }
.kpi .v { font-family: var(--f-display); font-size: 1.8rem; font-variant-numeric: tabular-nums; }
.kpi .d { font-size: .86rem; color: var(--ink-2); }
.kpi .delta { font-size: .8rem; font-weight: 700; }
.delta.up { color: var(--good); } .delta.down { color: var(--warn); }
.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; }
svg.chart { width: 100%; height: auto; display: block; }
svg.chart text { fill: var(--ink-2); font-size: 11px; font-family: var(--f-body); }
svg.chart .grid { stroke: var(--line); stroke-width: 1; }
svg.chart .bar { fill: var(--bar); }
svg.chart .bar:hover { opacity: .8; }
svg.chart .line { fill: none; stroke: var(--bar); stroke-width: 2.5; }
svg.chart .area { fill: var(--bar); opacity: .12; }
svg.chart .dot { fill: var(--bar); stroke: var(--surface); stroke-width: 2; }
.pics { display: flex; flex-wrap: wrap; gap: 8px; }
.pic { display: grid; justify-items: center; gap: 2px; width: 76px; font-size: .78rem; text-align: center; }
.pic img { width: 60px; height: 60px; background: #fff; border-radius: 10px; border: 1px solid var(--line); padding: 3px; }
.pic b { font-family: var(--f-mono); font-weight: 500; font-size: .74rem; color: var(--ink-2); }
.frases { display: grid; gap: 10px; }
.frase { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 12px; align-items: center; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
.frase:last-child { border-bottom: 0; padding-bottom: 0; }
.frase time { font-size: .8rem; color: var(--ink-2); font-family: var(--f-mono); grid-row: span 2; align-self: start; }
.frase .seq { display: flex; gap: 4px; flex-wrap: wrap; }
.frase .seq img { width: 40px; height: 40px; background: #fff; border-radius: 8px; border: 1px solid var(--line); }
.frase small { color: var(--ink-2); }
.tbl { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: .9rem; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { font-size: .72rem; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-2); }
td.num { text-align: right; font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
td img { width: 36px; height: 36px; background: #fff; border-radius: 6px; vertical-align: middle; }
.pill { display: inline-block; border-radius: 999px; padding: 1px 10px; font-size: .78rem; font-weight: 700; }
.pill.ok { background: color-mix(in srgb, var(--good) 18%, transparent); color: var(--good); }
.pill.treinar { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
.pill.novo { background: var(--zuli-soft); color: var(--ink); }
.stars { color: var(--zuli); letter-spacing: 1px; white-space: nowrap; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; gap: 6px; align-items: center; border: 2px solid var(--line); background: var(--surface); border-radius: 999px; padding: 3px 6px 3px 4px; cursor: pointer; }
.chip img { width: 28px; height: 28px; background: #fff; border-radius: 50%; }
form.row, .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
input[type="text"], input[type="number"], input[type="password"], input[type="search"], select { border: 2px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 10px; min-width: 0; }
.seg { display: inline-flex; flex-wrap: wrap; gap: 6px; }
.seg button { border: 2px solid var(--line); background: var(--surface); border-radius: 10px; padding: 6px 12px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
.field { display: grid; gap: 6px; }
.field > span { font-size: .78rem; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-2); font-weight: 700; }
.check { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; }
.check input { width: 20px; height: 20px; accent-color: var(--accent); margin-top: 2px; }
.gate { min-height: 70vh; display: grid; place-items: center; }
.gate .card { width: min(420px, 100%); text-align: center; justify-items: center; }
.gate img { width: 90px; }
.pinpad { display: grid; grid-template-columns: repeat(3, 64px); gap: 10px; justify-content: center; }
.pinpad button { height: 56px; border-radius: 14px; border: 2px solid var(--line); background: var(--surface); font-size: 1.3rem; font-weight: 700; cursor: pointer; }
.pindots { display: flex; gap: 10px; justify-content: center; }
.pindots i { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--ink-2); }
.pindots i.on { background: var(--ink); border-color: var(--ink); }
.empty { color: var(--ink-2); padding: 12px; border: 2px dashed var(--line); border-radius: 12px; text-align: center; }
.note { border-left: 4px solid var(--zuli); padding: 6px 0 6px 12px; color: var(--ink-2); font-size: .9rem; }

/* ---------- assistente de primeiro acesso ---------- */
.gate { min-height: 82vh; }
.wizard { width: min(560px, 100%); background: var(--surface); border-radius: 28px; padding: 22px 24px 26px; display: grid; gap: 16px; justify-items: center; text-align: center;
  box-shadow: 0 10px 40px rgba(23, 48, 94, .08); }
.wizard h1 { font-size: 1.7rem; }
.wizard .lead { font-size: 1.1rem; max-width: 40ch; }
.wizard .field { width: 100%; text-align: left; }
.wizard input[type="text"] { font-size: 1.15rem; padding: 12px 14px; width: 100%; }
.wz-top { width: 100%; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; }
.wz-top > :first-child { justify-self: start; }
.wz-dots { display: flex; gap: 8px; }
.wz-dots i { width: 12px; height: 12px; border-radius: 50%; background: var(--line); }
.wz-dots i.on { background: var(--zuli); box-shadow: 0 0 0 4px var(--zuli-soft); }
.wz-dots i.ok { background: var(--accent); }
.wz-zuli { width: 120px; height: 120px; }
.wz-zuli.festa { animation: pula .5s ease-in-out infinite alternate; }
@keyframes pula { to { transform: translateY(-6px) rotate(-3deg); } }
.wz-como { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; width: 100%; }
.wz-como > div { background: var(--zuli-soft); border-radius: 18px; padding: 14px 10px; display: grid; gap: 4px; justify-items: center; }
.wz-como .n { width: 30px; height: 30px; border-radius: 50%; background: var(--zuli); color: #17305e; font-family: var(--f-display); font-weight: 600; display: grid; place-items: center; }
.wz-como b { font-size: .95rem; line-height: 1.2; }
.wz-como small { color: var(--ink-2); font-size: .82rem; line-height: 1.3; }
.wz-vozes { display: grid; gap: 10px; width: 100%; }
.wz-voz { border: 3px solid var(--line); background: var(--surface); border-radius: 18px; padding: 14px 16px; cursor: pointer; text-align: left; display: grid; gap: 2px; position: relative; }
.wz-voz[aria-pressed="true"] { border-color: var(--zuli); background: var(--zuli-soft); }
.wz-voz small { color: var(--ink-2); padding-right: 80px; }
.wz-voz .ouvir { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); background: var(--accent); color: var(--accent-ink); border-radius: 999px; padding: 6px 12px; font-weight: 700; font-size: .85rem; }
.wz-dica { display: flex; gap: 14px; align-items: center; text-align: left; background: var(--zuli-soft); border-radius: 18px; padding: 14px 16px; }
.wz-dica svg { width: 44px; height: 44px; flex: none; background: var(--surface); border-radius: 12px; padding: 8px; }
.btn.big { font-size: 1.15rem; padding: 14px 28px; border-radius: 16px; min-width: 220px; justify-content: center; }
.btn.link { border: 0; background: none; color: var(--ink-2); padding: 4px 0; }
.seg.big button { padding: 10px 22px; font-size: 1.05rem; border-radius: 12px; }
.gate .card { box-shadow: 0 10px 40px rgba(23, 48, 94, .08); border: 0; border-radius: 28px; }
/* ---------- área dos pais: visual mais leve ---------- */
header { background: var(--zuli-soft); border-radius: 22px; padding: 14px 18px; }
nav.tabs { border-bottom: 0; gap: 8px; }
nav.tabs button { border: 0; border-radius: 999px; padding: 8px 18px; margin: 0; background: var(--surface); }
nav.tabs button[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); }
.card, .kpi { border: 0; box-shadow: 0 4px 18px rgba(23, 48, 94, .06); border-radius: 20px; }
@media (max-width: 560px) { .wz-como { grid-template-columns: 1fr; } .wizard { padding: 18px 16px 22px; } }

/* ---------- guia de cores (chave Fitzgerald, a mesma da prancha) ---------- */
:root { --c-pessoa: #f2c919; --c-acao: #47a85a; --c-coisa: #ef9437; --c-descricao: #4b8dd0; --c-social: #e27aae; --c-negacao: #df5252; --c-lugar: #9468c8; --c-tempo: #95a2ae; }
.cores { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; width: 100%; text-align: left; }
.cor { --cat: var(--c-tempo); display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 10px; align-items: center; padding: 10px 12px; border-radius: 16px;
  background: color-mix(in srgb, var(--cat) 15%, #fff); border: 3px solid color-mix(in srgb, var(--cat) 55%, #fff); color: #17305e; }
.cor .sw { width: 22px; height: 22px; border-radius: 50%; background: var(--cat); grid-row: span 2; }
.cor b { font-size: .95rem; } .cor small { color: #4c5b77; font-size: .82rem; }
.cor .ex { grid-column: 1 / -1; display: flex; gap: 6px; }
.cor .ex img { width: 40px; height: 40px; background: #fff; border-radius: 8px; padding: 2px; }
.ordem { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; justify-content: center; font-weight: 700; }
.ordem span { padding: 6px 12px; border-radius: 12px; color: #17305e; }
.wz-cores { width: 100%; text-align: left; background: var(--bg); border-radius: 16px; padding: 10px 14px; }
.wz-cores summary { cursor: pointer; }
.wz-cores[open] { display: grid; gap: 10px; }
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="gate" id="gate"></div>
  <div id="main" hidden style="display:grid;gap:20px">
    <header>
      <div class="who"><img src="assets/zuli.png" alt=""><div><h1 id="h-nome">Área dos pais</h1><p class="muted small" id="h-sub"></p></div></div>
      <div class="row"><a class="btn primary" href="./">Abrir a prancha</a><button type="button" class="btn" id="b-sair">Sair</button></div>
    </header>
    <nav class="tabs" role="tablist">
      <button type="button" role="tab" data-v="desenvolvimento" aria-selected="true">Desenvolvimento</button>
      <button type="button" role="tab" data-v="treino">Treino de fala</button>
      <button type="button" role="tab" data-v="perfil">Criança</button>
      <button type="button" role="tab" data-v="ajustes">Ajustes</button>
      <button type="button" role="tab" data-v="guia">Guia e cores</button>
    </nav>
    <section class="view" id="v-desenvolvimento"></section>
    <section class="view" id="v-treino" hidden></section>
    <section class="view" id="v-perfil" hidden></section>
    <section class="view" id="v-ajustes" hidden></section>
    <section class="view" id="v-guia" hidden></section>
    <p class="muted small">Os dados ficam só neste aparelho. <a href="resultados.html">Resultados da pesquisa</a> · Pictogramas: Sergio Palao, <a href="https://arasaac.org" target="_blank" rel="noopener">ARASAAC</a> (CC BY-NC-SA 4.0).</p>
  </div>
</div>
<script type="module" src="js/pais.js"></script>
</body>
</html>
